<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Просмотр презентации</title><meta name="robots" content="noindex"><style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#dce3df;color:#173f3b}.tools{position:sticky;top:0;z-index:2;background:#f8faf7;border-bottom:1px solid #bccdc3;display:flex;align-items:center;justify-content:center;gap:13px;padding:9px;font-size:12px;min-height:54px}button,select,input{font:inherit;color:inherit;border:1px solid #b6c8bc;background:white;border-radius:0;min-height:33px}button{padding:4px 12px;cursor:pointer;font-size:17px}button:disabled{opacity:.3;cursor:default}input{width:48px;text-align:center;padding:4px}select{padding:4px 8px;margin-left:8px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #246d5d;outline-offset:2px}#status{text-align:center;padding:35px;font-size:14px;line-height:1.8}#sheet{padding:20px;overflow:auto;min-height:calc(100dvh - 54px)}canvas{display:block;margin:0 auto;box-shadow:0 3px 18px #142c2526;background:white}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}#error a{color:#0a5744;text-decoration:underline}@media(max-width:550px){.tools{gap:8px;padding:7px 5px;min-height:48px}button{padding:2px 10px}select{margin:0;max-width:112px;font-size:11px}#sheet{padding:8px 0}input{width:38px}.tools label{font-size:10px}}
</style></head><body>
<div class="tools" aria-label="Управление страницами"><button id="prev" disabled aria-label="Предыдущая страница">‹</button><label for="page">Страница</label><input id="page" type="number" value="1" min="1" aria-label="Номер страницы" disabled><span id="total">/ …</span><button id="next" disabled aria-label="Следующая страница">›</button><label for="zoom" class="sr-only">Масштаб</label><select id="zoom"><option value="fit">По ширине</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></div>
<div id="status" role="status" aria-live="polite">Загружаем презентацию…</div><div id="error" hidden></div><main id="sheet"><div id="accessible-text" class="sr-only"></div></main>
<script type="module">
import * as pdfjs from './pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='./pdf.worker.mjs';
const params=new URLSearchParams(location.search),file=params.get('file');
const prev=document.querySelector('#prev'),next=document.querySelector('#next'),input=document.querySelector('#page'),zoom=document.querySelector('#zoom'),sheet=document.querySelector('#sheet'),status=document.querySelector('#status');
let pdf=null,pageNumber=1,renderTask=null,generation=0,resizeTimer;
function reportError(){status.textContent='Не удалось показать презентацию в окне просмотра.';const link=document.createElement('a');link.href=/^(resursproekt-portfolio|p\d{2})\.pdf$/.test(file||'')?file:'resursproekt-portfolio.pdf';link.target='_blank';link.rel='noopener noreferrer';link.textContent='Открыть исходный PDF';const box=document.querySelector('#error');box.replaceChildren(link);box.style.cssText='text-align:center;padding:10px 20px';box.hidden=false}
async function renderPage(){if(!pdf)return;const gen=++generation;if(renderTask){renderTask.cancel();renderTask=null}input.value=String(pageNumber);prev.disabled=pageNumber===1;next.disabled=pageNumber===pdf.numPages;const page=await pdf.getPage(pageNumber);if(gen!==generation)return;const original=page.getViewport({scale:1});const scale=zoom.value==='fit'?Math.min((document.documentElement.clientWidth-(innerWidth<550?0:40))/original.width,1.65):Number(zoom.value);const viewport=page.getViewport({scale});const dpr=Math.min(devicePixelRatio||1,2);const canvas=document.createElement('canvas');canvas.width=Math.floor(viewport.width*dpr);canvas.height=Math.floor(viewport.height*dpr);canvas.style.width=Math.floor(viewport.width)+'px';canvas.style.height=Math.floor(viewport.height)+'px';canvas.setAttribute('role','img');canvas.setAttribute('aria-label','Страница '+pageNumber+' из '+pdf.numPages);const old=sheet.querySelector('canvas');if(old)old.replaceWith(canvas);else sheet.prepend(canvas);renderTask=page.render({canvasContext:canvas.getContext('2d'),viewport,transform:dpr===1?null:[dpr,0,0,dpr,0,0]});try{await renderTask.promise;if(gen!==generation)return;status.hidden=true;sheet.setAttribute('data-page',String(pageNumber));const text=await page.getTextContent();if(gen===generation)document.querySelector('#accessible-text').textContent=text.items.map(x=>x.str||'').join(' ')}catch(e){if(e.name!=='RenderingCancelledException')reportError()}}
function move(n){if(!pdf)return;const target=Math.max(1,Math.min(pdf.numPages,n));if(target===pageNumber)return;pageNumber=target;renderPage();window.scrollTo({top:0,behavior:'instant'})}
prev.addEventListener('click',()=>move(pageNumber-1));next.addEventListener('click',()=>move(pageNumber+1));input.addEventListener('change',()=>move(Number(input.value)||1));zoom.addEventListener('change',renderPage);
window.addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(pageNumber+1)}if(e.key==='ArrowLeft'){e.preventDefault();move(pageNumber-1)}});
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(zoom.value==='fit')renderPage()},180)});
try{if(!/^(resursproekt-portfolio|p\d{2})\.pdf$/.test(file||''))throw Error('Invalid document');pdf=await pdfjs.getDocument({url:file,isEvalSupported:false,isImageDecoderSupported:false,useSystemFonts:true}).promise;document.querySelector('#total').textContent='/ '+pdf.numPages;input.max=String(pdf.numPages);input.disabled=false;await renderPage()}catch(e){reportError()}
</script></body></html>
